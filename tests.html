<body>
<h1>まじゃすこ 計算ロジックテスト</h1>
<p class="note">本番アプリ（index.html）をiframeで読み込み、実物の関数（rankGroups / calcScores / applyChombo / gameTotals / chipTotals ／ 送信キューの applyOp ／ 対戦成績の h2hAdd・buildPersonResolver ／ 仲間ページの extractSessionIds・autoBindNames・circleStats）をそのまま検証します。このページは検証用でnoindexです。</p>
<div id="summary">実行中...</div>
<div id="out"></div>
<iframe id="app" src="/index.html" style="width:1px;height:1px;opacity:0;position:absolute"></iframe>
<script>
function approx(a, b) { return Math.abs(a - b) < 1e-9; }
function arrEq(a, b) { return a.length === b.length && a.every((v, i) => approx(v, b[i])); }

function buildCases(w) {
  const S4 = { numPlayers: 4, startPoints: 25000, returnPoints: 30000, uma: [30, 10, -10, -30] };
  const S3 = { numPlayers: 3, startPoints: 35000, returnPoints: 40000, uma: [15, 0, -15] };
  return [
    // ---- rankGroups: 同点処理の一元ロジック ----
    ['rankGroups: 全員バラバラなら順位1-4', () => {
      const g = w.rankGroups([40, 30, 20, 10]);
      return arrEq(g.map(x => x.avgRank), [1, 2, 3, 4]) && g[0].isTop && !g[1].isTop && g[3].isLast && !g[2].isLast;
    }],
    ['rankGroups: トップ2人同点は平均1.5位・両方isTop', () => {
      const g = w.rankGroups([30, 30, 20, 10]);
      return g[0].avgRank === 1.5 && g[1].avgRank === 1.5 && g[0].isTop && g[1].isTop && g[0].size === 2 && g[3].isLast;
    }],
    ['rankGroups: 中間2人同点は平均2.5位', () => {
      const g = w.rankGroups([40, 20, 20, 10]);
      return g[1].avgRank === 2.5 && g[2].avgRank === 2.5 && !g[1].isTop && !g[1].isLast;
    }],
    ['rankGroups: ラス2人同点は平均3.5位・両方isLast', () => {
      const g = w.rankGroups([40, 30, 10, 10]);
      return g[2].avgRank === 3.5 && g[3].avgRank === 3.5 && g[2].isLast && g[3].isLast;
    }],
    ['rankGroups: 全員同点は全員2.5位・isTopかつisLast', () => {
      const g = w.rankGroups([25, 25, 25, 25]);
      return g.every(x => x.avgRank === 2.5 && x.isTop && x.isLast && x.size === 4);
    }],
    // ---- calcScores: 返し点・ウマ・オカ ----
    ['calcScores: 標準4人（35000/28000/22000/15000 → +55/+8/-18/-45）', () => {
      return arrEq(w.calcScores([35000, 28000, 22000, 15000], S4), [55, 8, -18, -45]);
    }],
    ['calcScores: 合計は常にゼロサム（標準4人）', () => {
      const r = w.calcScores([35000, 28000, 22000, 15000], S4);
      return approx(r.reduce((a, b) => a + b, 0), 0);
    }],
    ['calcScores: トップ同点はウマ+オカを山分け（30000×2/20000×2 → +30/+30/-30/-30）', () => {
      return arrEq(w.calcScores([30000, 30000, 20000, 20000], S4), [30, 30, -30, -30]);
    }],
    ['calcScores: 小数を含む点数（35400/28300/21300/15000 → +55.4/+8.3/-18.7/-45）', () => {
      return arrEq(w.calcScores([35400, 28300, 21300, 15000], S4), [55.4, 8.3, -18.7, -45]);
    }],
    ['calcScores: 3人麻雀（45000/40000/20000 → +35/0/-35）', () => {
      const r = w.calcScores([45000, 40000, 20000], S3);
      return arrEq(r, [35, 0, -35]) && approx(r.reduce((a, b) => a + b, 0), 0);
    }],
    // ---- チョンボ罰符 ----
    ['applyChombo: 罰符ptsをチェック者から減算（55/8/-18/-45で4人目チョンボ→-65）', () => {
      return arrEq(w.applyChombo([55, 8, -18, -45], [0, 0, 0, 1], { chombo: true, chomboPenalty: 20 }), [55, 8, -18, -65]);
    }],
    ['applyChombo: マークのみ（罰符0）はスコアに影響しない', () => {
      return arrEq(w.applyChombo([55, 8, -18, -45], [1, 0, 0, 0], { chombo: true, chomboPenalty: 0 }), [55, 8, -18, -45]);
    }],
    ['applyChombo: chombo設定なしの旧データはそのまま', () => {
      return arrEq(w.applyChombo([55, 8, -18, -45], null, {}), [55, 8, -18, -45]);
    }],
    // ---- 集計と旧データ互換 ----
    ['roundMembers: members無しの旧ラウンドは先頭numPlayers人扱い', () => {
      const mem = w.roundMembers({ scores: [1, 2, 3, 4] }, { numPlayers: 4, playerNames: ['A', 'B', 'C', 'D', 'E'] });
      return arrEq(mem, [0, 1, 2, 3]);
    }],
    ['gameTotals: members指定ありの試合は該当メンバーだけに加算', () => {
      const g = {
        settings: { numPlayers: 4, playerNames: ['A', 'B', 'C', 'D', 'E'] },
        rounds: [
          { scores: [10, 5, -5, -10], members: [0, 1, 2, 3] },
          { scores: [20, -5, -5, -10], members: [1, 2, 3, 4] }
        ]
      };
      return arrEq(w.gameTotals(g), [10, 25, -10, -15, -10]);
    }],
    ['gameTotals: 旧形式（members無し）も正しく合算', () => {
      const g = {
        settings: { numPlayers: 4, playerNames: ['A', 'B', 'C', 'D'] },
        rounds: [{ scores: [45, 6, -18, -33] }, { scores: [-10, 20, -5, -5] }]
      };
      return arrEq(w.gameTotals(g), [35, 26, -23, -38]);
    }],
    ['playedFlags: 未参加メンバーはfalse', () => {
      const g = {
        settings: { numPlayers: 4, playerNames: ['A', 'B', 'C', 'D', 'E'] },
        rounds: [{ scores: [1, 2, 3, 4], members: [0, 1, 2, 3] }]
      };
      const f = w.playedFlags(g);
      return f[0] && f[1] && f[2] && f[3] && !f[4];
    }],
    ['chipTotals: チップ差の累計と焼き鳥回数', () => {
      const g = {
        settings: { numPlayers: 4, playerNames: ['A', 'B', 'C', 'D'] },
        rounds: [
          { scores: [1, 2, 3, 4], members: [0, 1, 2, 3], chips: [3, -1, 0, -2], yakitori: [0, 0, 0, 1] },
          { scores: [1, 2, 3, 4], members: [0, 1, 2, 3], chips: [-1, 1, 0, 0], yakitori: [0, 0, 0, 1] }
        ]
      };
      const { chips, yaki } = w.chipTotals(g);
      return arrEq(chips, [2, 0, 0, -2]) && arrEq(yaki, [0, 0, 0, 2]);
    }],
    // ---- 送信キュー（applyOp）: 点数が消えない・二重にならない・他の人の入力を上書きしない ----
    ...opCases(w),
    // ---- 対戦成績（h2hAdd）: 同じ試合に出た2人の勝ち負け・着順・スコア差 ----
    ...h2hCases(w),
    // ---- 仲間ページ: URLの取り出し・名前の自動結びつけ・通算 ----
    ...circleCases(w),
  ];
}

function circleCases(w) {
  const S = (names, np = 4) => ({ playerNames: names, numPlayers: np, startPoints: 25000, returnPoints: 30000, uma: [30, 10, -10, -30] });
  const R = (members, points, scores) => ({ members, points, scores });
  return [
    ['extractSessionIds: LINEのトーク文から試合のIDだけを出てきた順に取り出す（重複・仲間ページ・招待・引き継ぎは除く）', () => {
      const text = `2026/09/20(土)\n20:15 たろう https://majasco.jp/#AbCdEfGhJk\n20:16 じろう 今日の結果 https://majasco.jp/?openExternalBrowser=1#MnPqRsTuVw です\n`
        + `https://majasco.jp/#AbCdEfGhJk\nhttps://majasco.jp/#c=QwErTyUpAs\nhttps://majasco.jp/?openExternalBrowser=1#join=K7P2QX9M\nhttps://majasco.jp/#my=AbCdEfGhJkMnPq\n`
        + `https://mahjong-score-2e8aa.web.app/#ZxCvBnMzXc と https://majasco.jp/#howto`;
      const ids = w.extractSessionIds(text);
      return JSON.stringify(ids) === JSON.stringify(['AbCdEfGhJk', 'MnPqRsTuVw', 'ZxCvBnMzXc']);
    }],
    ['extractSessionIds: 22文字の古いIDも拾い、10文字の途中で切らない', () => {
      const id22 = 'AbCdEfGhJkMnPqRsTuVwXy';
      return JSON.stringify(w.extractSessionIds('https://majasco.jp/#' + id22)) === JSON.stringify([id22]);
    }],
    ['autoBindNames: 表記ゆれ（全角半角・空白）は同じ人。仮名A・B…と名簿にない名前は null。同じ人を2席に結びつけない', () => {
      const roster = { m1: { name: 'たろう' }, m2: { name: 'Jiro' } };
      const r = w.autoBindNames(['たろう', 'ＪＩＲＯ', 'A', 'さぶろう', 'た ろう'], roster);
      return JSON.stringify(r) === JSON.stringify(['m1', 'm2', null, null, null]);
    }],
    ['circleStats: 結びつけた席だけを名簿の人として通算する（2ゲームにまたがる同じ人を1人に）', () => {
      const g1 = { settings: S(['たろう', 'じろう', 'さぶろう', 'しろう']), rounds: [R([0, 1, 2, 3], [42000, 31000, 18000, 9000], [62, 11, -22, -51])] };
      const g2 = { settings: S(['太郎', 'じろう', 'ごろう', 'しろう']), rounds: [R([0, 1, 2, 3], [45000, 28000, 17000, 10000], [65, 8, -23, -50])] };
      const circle = {
        roster: { T: { name: 'たろう' }, J: { name: 'じろう' }, S: { name: 'しろう' } },
        games: { g1: { seats: { 0: { mid: 'T' }, 1: { mid: 'J' }, 3: { mid: 'S' } } },
                 g2: { seats: { 0: { mid: 'T' }, 1: { mid: 'J' }, 3: { mid: 'S' } } } } };
      const st = w.circleStats(circle, { g1, g2 }, '4');
      const t = st.list.find(p => p.key === 'T');
      return st.list.length === 3 && t.n === 2 && approx(t.score, 127) && approx(t.rankSum, 2)
        && st.list[0].key === 'T' && st.acc.T.J.n === 2 && st.acc.T.J.w === 2;
    }],
    ['circleStats: 三麻と四麻は別に数える・名簿から外れた人の席は数えない', () => {
      const g4 = { settings: S(['たろう', 'じろう', 'さぶろう', 'しろう']), rounds: [R([0, 1, 2, 3], [42000, 31000, 18000, 9000], [62, 11, -22, -51])] };
      const g3 = { settings: { playerNames: ['たろう', 'じろう', 'さぶろう'], numPlayers: 3, startPoints: 35000, returnPoints: 35000, uma: [10, 0, -10] },
        rounds: [R([0, 1, 2], [50000, 35000, 20000], [25, 0, -25])] };
      const circle = { roster: { T: { name: 'たろう' } }, games: { a: { seats: { 0: { mid: 'T' }, 1: { mid: 'GONE' } } }, b: { seats: { 0: { mid: 'T' } } } } };
      const s4 = w.circleStats(circle, { a: g4, b: g3 }, '4'), s3 = w.circleStats(circle, { a: g4, b: g3 }, '3');
      return s4.list.length === 1 && s4.list[0].n === 1 && approx(s4.list[0].score, 62)
        && s3.list.length === 1 && approx(s3.list[0].score, 25);
    }],
    ['circleStats: 成績表・メンバーの成績用に着順の内訳（同点は按分）・最高/最低点数・1試合ごとの着順を持つ', () => {
      const g = { settings: S(['たろう', 'じろう', 'さぶろう', 'しろう']), createdAt: '2026-09-01T10:00:00.000Z', rounds: [
        R([0, 1, 2, 3], [42000, 31000, 18000, 9000], [62, 11, -22, -51]),
        R([0, 1, 2, 3], [30000, 30000, 25000, 15000], [25, 25, -10, -40])] };
      const circle = { roster: { T: { name: 'たろう' }, J: { name: 'じろう' } }, games: { g: { seats: { 0: { mid: 'T' }, 1: { mid: 'J' } } } } };
      const st = w.circleStats(circle, { g }, '4');
      const t = st.list.find(p => p.key === 'T'), j = st.list.find(p => p.key === 'J');
      return arrEq(t.counts, [1.5, 0.5, 0, 0]) && arrEq(j.counts, [0.5, 1.5, 0, 0]) && t.ptMax === 42000 && t.ptMin === 30000
        && t.hist.length === 2 && t.hist[0].rank === 1 && t.hist[0].tie === false && t.hist[1].rank === 1 && t.hist[1].tie === true
        && j.hist[0].rank === 2 && j.hist[1].rank === 1;
    }],
    ['circleStats: 各自の直近n戦（perN）は、人ごとにその人が出た新しい方からn戦だけを数える（対戦は行の人の直近n戦）', () => {
      const at = i => ({ at: `2026-09-25T10:0${i}:00.000Z` });
      // T は第1〜4試合、J は第1・3・5試合に出た（5人を回し打ち）
      const g = { settings: S(['たろう', 'じろう', 'さぶろう', 'しろう', 'ごろう']), rounds: [
        { ...R([0, 1, 2, 3], [40000, 30000, 20000, 10000], [50, 10, -20, -40]), ...at(0) },
        { ...R([0, 2, 3, 4], [40000, 30000, 20000, 10000], [50, 10, -20, -40]), ...at(1) },
        { ...R([0, 1, 2, 3], [10000, 20000, 30000, 40000], [-40, -20, 10, 50]), ...at(2) },
        { ...R([0, 2, 3, 4], [30000, 40000, 20000, 10000], [10, 50, -20, -40]), ...at(3) },
        { ...R([1, 2, 3, 4], [40000, 30000, 20000, 10000], [50, 10, -20, -40]), ...at(4) }] };
      const circle = { roster: { T: { name: 'たろう' }, J: { name: 'じろう' } }, games: { g: { seats: { 0: { mid: 'T' }, 1: { mid: 'J' } } } } };
      const st = w.circleStats(circle, { g }, '4', null, 2);
      const t = st.list.find(p => p.key === 'T'), j = st.list.find(p => p.key === 'J');
      const all = w.circleStats(circle, { g }, '4');
      return t.n === 2 && approx(t.score, -40 + 10) && arrEq(t.hist.map(h => h.o), [2, 3])   // T の直近2戦＝第3・4試合（元の番号のまま）
        && j.n === 2 && approx(j.score, -20 + 50) && arrEq(j.hist.map(h => h.o), [2, 4])     // J の直近2戦＝第3・5試合
        && st.acc.T.J.n === 1 && st.acc.J.T.n === 1                                          // 2人とも出た第3試合だけ（第1試合は2人の直近2戦の外）
        && all.list.find(p => p.key === 'T').n === 4 && all.acc.T.J.n === 2;
    }],
    ['circleStats: 素点（(持ち点−配給原点)÷1000の合計）・順位点（スコア−素点＝ウマ＋オカ。1位はオカの取り分、2位以下はオカの払い）・5万点以上（ちょうども入る）・箱下（0点未満）の回数', () => {
      const g = { settings: S(['たろう', 'じろう', 'さぶろう', 'しろう']), rounds: [
        R([0, 1, 2, 3], [50000, 31000, 22000, -3000], [70, 11, -18, -63]),
        R([0, 1, 2, 3], [42000, 30000, 18000, 10000], [62, 10, -22, -50])] };
      const circle = { roster: { T: { name: 'たろう' }, S: { name: 'しろう' } }, games: { g: { seats: { 0: { mid: 'T' }, 3: { mid: 'S' } } } } };
      const st = w.circleStats(circle, { g }, '4');
      const t = st.list.find(p => p.key === 'T'), s = st.list.find(p => p.key === 'S');
      return Math.abs(w.rawPtsOf(t) - 42) < 1e-9 && Math.abs(w.rankPtsOf(t) - 90) < 1e-9 // 1位×2: ウマ30＋オカ15（5×3人分） && w.overOf(t) === 1 && w.boxOf(t) === 0
        && Math.abs(w.rawPtsOf(s) + 43) < 1e-9 && Math.abs(w.rankPtsOf(s) + 70) < 1e-9 // 4位×2: ウマ−30−オカ5 && w.boxOf(s) === 1 && w.overOf(s) === 0;
    }],
    ['roundMs: 2日以上にわたる試合は、日の区切り（dayStarts＝2日目・3日目が始まる試合の番号）でその試合の日になる', () => {
      const r = () => R([0, 1, 2, 3], [40000, 30000, 20000, 10000], [50, 10, -20, -40]);
      const g = { settings: { ...S(['A', 'B', 'C', 'D']), playDate: '2026-09-26', playDateEnd: '2026-09-28', dayStarts: [2, 4] }, rounds: [r(), r(), r(), r()] };
      const ds = g.rounds.map(x => w.ymdLocal(new Date(w.roundMs(g, x))));
      const g0 = { settings: { ...S(['A', 'B', 'C', 'D']), playDate: '2026-09-26', playDateEnd: '2026-09-28' }, rounds: [r(), r()] }; // 区切りなし＝1日目
      return ds.join(',') === '2026-09-26,2026-09-27,2026-09-27,2026-09-28' &&w.ymdLocal(new Date(w.roundMs(g0, g0.rounds[1]))) === '2026-09-26';
    }],
  ];
}

function h2hCases(w) {
  const S = (names, np = 4) => ({ playerNames: names, numPlayers: np, startPoints: 25000, returnPoints: 30000, uma: [30, 10, -10, -30] });
  const idx = m => m;
  return [
    ['h2hAdd: 1試合なら上の着順の人に1勝・スコア差と着順も入る', () => {
      const g = { settings: S(['A', 'B', 'C', 'D']), rounds: [{ points: [35000, 28000, 22000, 15000], scores: [55, 8, -18, -45] }] };
      const a = w.h2hAdd({}, g, idx);
      const e = a[0][3], r = a[3][0];
      return e.n === 1 && e.w === 1 && e.l === 0 && r.l === 1 && approx(e.scoreA - e.scoreB, 100)
        && approx(e.rankA, 1) && approx(e.rankB, 4);
    }],
    ['h2hAdd: 同じ点数は引き分け（平均順位が同じ）', () => {
      const g = { settings: S(['A', 'B', 'C', 'D']), rounds: [{ points: [30000, 30000, 25000, 15000], scores: [30, 30, -15, -45] }] };
      const e = w.h2hAdd({}, g, idx)[0][1];
      return e.n === 1 && e.w === 0 && e.l === 0 && e.d === 1 && approx(e.rankA, 1.5) && approx(e.rankB, 1.5);
    }],
    ['h2hAdd: 抜け番の試合は数えない（同じ試合に出たときだけ）', () => {
      const g = { settings: S(['A', 'B', 'C', 'D', 'E']), rounds: [
        { members: [0, 1, 2, 3], points: [35000, 28000, 22000, 15000], scores: [55, 8, -18, -45] },
        { members: [4, 1, 2, 3], points: [35000, 28000, 22000, 15000], scores: [55, 8, -18, -45] }] };
      const a = w.h2hAdd({}, g, idx);
      return a[0][1].n === 1 && a[1][2].n === 2 && !(a[0][4]) && a[4][1].w === 1;
    }],
    ['h2hAdd: keyOfで名前をまとめると、別のゲームの同じ人は1人として足される', () => {
      const g1 = { settings: S(['自分', '太郎', 'C', 'D']), rounds: [{ points: [35000, 28000, 22000, 15000], scores: [55, 8, -18, -45] }] };
      const g2 = { settings: S(['たろう', '自分', 'X', 'Y']), rounds: [{ points: [35000, 28000, 22000, 15000], scores: [55, 8, -18, -45] }] };
      const acc = {};
      w.h2hAdd(acc, g1, m => (m === 0 ? '@me' : m === 1 ? 'taro' : null));
      w.h2hAdd(acc, g2, m => (m === 1 ? '@me' : m === 0 ? 'taro' : null));
      const e = acc['@me'].taro;
      return e.n === 2 && e.w === 1 && e.l === 1 && Object.keys(acc['@me']).length === 1;
    }],
    ['h2hAdd: 点数が欠けた試合は飛ばす（壊れたデータで落ちない）', () => {
      const g = { settings: S(['A', 'B', 'C', 'D']), rounds: [{ points: [35000, null, 22000, 15000], scores: [55, 8, -18, -45] }] };
      return Object.keys(w.h2hAdd({}, g, idx)).length === 0;
    }],
    ['personKey: 全角半角・大文字小文字・空白の違いは同じ人とみなす', () =>
      w.personKey('Ｔａｒｏ　Y') === w.personKey('taroy') && w.personKey('たろう') !== w.personKey('太郎')],
    ['buildPersonResolver: アカウント登録のある席はアカウント、無い席は名前。仮名A・B…は数えない', () => {
      const g1 = { settings: S(['たろう', 'じろう', 'A', 'B']) }, g2 = { settings: S(['タロウ', 'じろう', 'C', 'D']) };
      const r = w.buildPersonResolver([{ g: g1, claims: { 0: 'U1' } }, { g: g2, claims: { 0: 'U1' } }]);

      return r.status === 'conflict' && r.game.settings.startPoints === 30000;
    }],
    ['applyOp 設定変更: 削除したメンバーの試合がそのあいだに入っていたら反映しない', () => {
      let g = G0(); g.settings.playerNames = ['A', 'B', 'C', 'D', 'E']; // Eを消す設定を作っているあいだに、Eが対局した
      const base = { name: g.name, settings: JSON.parse(JSON.stringify(g.settings)) };
      g = apply(g, add('withE', P1, 0, [0, 1, 2, 4], g.settings.playerNames)).game;
      const r = apply(g, { id: 's3', sid: 'TESTGAME01', at: T(9), kind: 'settings', baseFp: w.fpOf(base), name: g.name,
        settings: SET(), memberMap: { 0: 0, 1: 1, 2: 2, 3: 3 }, changes: ['メンバー削除: E'] });
      return r.status === 'conflict' && r.game.rounds.length === 1;
    }],
    ['applyOp 追加: 入力中にメンバーが並び替えられても、名前で正しい人に付け直す', () => {
      const g = G0(); g.settings.playerNames = ['D', 'C', 'B', 'A'];
      const r = apply(g, add('re', P1, 0, [0, 1, 2, 3], NAMES)); // A,B,C,D の順で入力した
      return r.status === 'apply' && arrEq(r.game.rounds[0].members, [3, 2, 1, 0]);
    }],
    ['applyOp 追加: 入力中に参加者の名前が変わっても、人数が同じなら同じ人のまま', () => {
      const g = G0(); g.settings.playerNames = ['A', 'Bさん', 'C', 'D'];
      const r = apply(g, add('rn', P1, 0, [0, 1, 2, 3], NAMES));
      return r.status === 'apply' && arrEq(r.game.rounds[0].members, [0, 1, 2, 3]);
    }],
    ['describeSettingsChanges: メンバーの追加・名前変更・削除と持ち点の変更を1行ずつ書く', () => {
      const base = { name: 'X', settings: SET() };
      const next = { name: 'Y', settings: { ...SET(), playerNames: ['A', 'B2', 'C', 'E'], startPoints: 30000 } };
      const st = [{ orig: 0 }, { orig: 1 }, { orig: 2 }, { orig: null }];
      const c = w.describeSettingsChanges(base, next, st);
      return ['ゲーム名: X → Y', '名前変更: B → B2', 'メンバー追加: E', 'メンバー削除: D', '持ち点: 25,000 → 30,000']
        .every(x => c.includes(x)) && c.length === 5;
    }],
    ['applyOp 元に戻す: 見ていた状態のままなら戻す／その後に他の人が入力していたら戻さない', () => {
      const g = withRounds(P1);
      const snap = { name: g.name, settings: g.settings, rounds: [] };
      const baseFp = w.fpOf({ name: g.name, settings: g.settings, rounds: g.rounds.map(w.roundCore) });
      const ok = apply(g, { id: 'r1', sid: 'TESTGAME01', at: T(9), kind: 'restore', baseFp, snap, label: '戻す' });
      const moved = apply(g, add('late', P2, 5)).game;
      const ng = apply(moved, { id: 'r2', sid: 'TESTGAME01', at: T(9), kind: 'restore', baseFp, snap, label: '戻す' });
      return ok.status === 'apply' && ok.game.rounds.length === 0 && ng.status === 'conflict' && ng.game.rounds.length === 2;
    }],
  ];
}

window.addEventListener('load', () => {
  const frame = document.getElementById('app');
  let tries = 0;
  const wait = () => {
    let w = null;
    try { w = frame.contentWindow; } catch (e) {}
    if (!w || typeof w.rankGroups !== 'function' || typeof w.applyChombo !== 'function' || typeof w.applyOp !== 'function' || typeof w.h2hAdd !== 'function' || typeof w.buildPersonResolver !== 'function' || typeof w.circleStats !== 'function') {
      if (++tries > 100) return done(null, 'アプリの読み込みに失敗しました（関数が見つかりません）');
      return setTimeout(wait, 100);
    }
    run(w);
  };
  wait();
});

function run(w) {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  buildCases(w).forEach(([name, fn]) => {
    let ok = false, err = '';
    try { ok = !!fn(); } catch (e) { err = String(e); }
    const div = document.createElement('div');
    div.className = 'case ' + (ok ? 'ok' : 'ng');
    div.textContent = name;
    if (!ok && err) {
      const d = document.createElement('span');
      d.className = 'detail'; d.textContent = err;
      div.appendChild(d);
    }
    out.appendChild(div);
    ok ? pass++ : fail++;
  });
  done(fail === 0, `${pass + fail}件中 ${pass}件成功 / ${fail}件失敗`);
}

function done(allPass, msg) {
  const s = document.getElementById('summary');
  s.textContent = (allPass === null ? 'ERROR: ' : allPass ? 'ALL PASS — ' : 'FAIL — ') + msg;
  s.className = allPass ? 'pass' : 'fail';
  document.title = (allPass ? '[PASS] ' : '[FAIL] ') + '計算ロジックテスト';
}
</script>

# 毎日、本番DBの「アカウントの試合一覧・仲間ページ」を書き出し、暗号化して Actions の成果物（artifact）に90日残す（2026-10-24〜）
# - 試合の中身（sessions）は誰にも消せないルールなので入れない
# - 公開リポジトリの成果物は GitHub にログインした人なら誰でもダウンロードできるので、必ず暗号化してから置く。
#   暗号化は公開鍵（tools/backup-cert.pem）で行う＝Secrets の登録は要らない。開く秘密鍵は非公開の majasco-assets の「バックアップの鍵」だけにある（2026-10-27〜）
# - 戻し方は docs/site-spec.md「バックアップ」
name: DB backup (daily)
on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 3:17（日本時間）
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == '1046nee/mahjong-score'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 書き出す
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAHJONG_SCORE_2E8AA }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 tools/db_backup.py "$RUNNER_TEMP/backup.json"
      - name: 暗号化する（元のファイルは消す）
        run: |
          gzip -9 "$RUNNER_TEMP/backup.json"
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/backup.json.gz" \
            -out "$RUNNER_TEMP/backup.json.gz.cms" -outform DER tools/backup-cert.pem
          rm -f "$RUNNER_TEMP/backup.json.gz"
          echo "STAMP=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: ${{ runner.temp }}/backup.json.gz.cms
          retention-days: 90
          if-no-files-found: error

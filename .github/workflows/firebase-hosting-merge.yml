# mainブランチにpush（マージ）されたら本番のFirebase Hostingへ自動デプロイ
# このサイトはビルド不要の静的サイトのため、ビルドステップはありません
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
# 続けてpushしたとき、前のデプロイが後から終わって新しい版を古い版で上書きしないよう、
# 同時に走るデプロイは1つだけにし、新しいpushが来たら古い方を止める（2026-10-08 実際に古い版に戻った）
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 主要動線のスモークテスト（グループ作成→URL共有→自動参加→点数入力→結果表示）。
      # 失敗したらここでジョブが止まり、壊れたコードは本番にデプロイされない
      - name: スモークテスト（失敗したらデプロイ中止）
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/smoke_test.py
      # 版の印（アプリが新しい版に気づいて読み込み直すため。index.html の __APP_VERSION__ と /version.txt に同じコミット）
      - name: 版の印を入れる
        run: |
          test "$(grep -c "'__APP_VERSION__'" index.html)" = 1
          sed -i "s/'__APP_VERSION__'/'$GITHUB_SHA'/" index.html
          echo "$GITHUB_SHA" > version.txt
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAHJONG_SCORE_2E8AA }}
          channelId: live
          projectId: mahjong-score-2e8aa
